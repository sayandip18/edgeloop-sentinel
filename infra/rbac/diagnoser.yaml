# Read-only identity for the diagnosis agent (Phase 6).
# The ClusterRole only defines the permission set; it is bound with a RoleBinding
# in `apps` only, so the diagnoser sees nothing outside the workload namespace.
# No secrets, no write verbs, no exec, no nodes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnoser
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edgeloop-diagnoser-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, configmaps]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edgeloop-diagnoser-read
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edgeloop-diagnoser-read
subjects:
  - kind: ServiceAccount
    name: diagnoser
    namespace: observability
---
# Phase 6: read-only query route to Prometheus and Loki. `get` on services/proxy is an HTTP GET through the API
# server, limited to these two named service:port pairs. agent/obsquery.py additionally allows only the query
# endpoints, scoped to the `apps` namespace. No other service in `observability` is reachable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edgeloop-diagnoser-obs-query
  namespace: observability
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["kps-prometheus:http-web", "loki:http-metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edgeloop-diagnoser-obs-query
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: edgeloop-diagnoser-obs-query
subjects:
  - kind: ServiceAccount
    name: diagnoser
    namespace: observability
