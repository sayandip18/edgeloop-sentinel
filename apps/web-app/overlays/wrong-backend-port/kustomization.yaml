apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: web-app}
    # Recreate so the old (correct) pod does not keep serving; the harness then sees "no Ready pod" like a real outage.
    patch: |-
      - op: add
        path: /spec/strategy
        value: {type: Recreate}
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "http://backend-app:8081"
