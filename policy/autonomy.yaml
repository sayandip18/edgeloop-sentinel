# Autonomy policy: the most a fix class may do on its own. Every class starts at L1 (open a PR, a human merges).
# policy/risk.py reads this file. Nothing in `classes` can grant more than L1: L2/L3 come only from
# policy/promotions.json, which policy/promotion.py writes from measured eval results (Phase 9).
#   L0 notify only (no PR)   L1 PR for a human to merge
#   L2 the merger (agent/merger.py) merges a gate-passed PR after a soak delay   L3 same, with a short soak delay

default_level: L0             # a fix class not listed here may only notify

classes:
  revert-recent-change: L1
  raise-memory-limit: L1
  # Phase 7: patches written by the LLM fix agent, one class per remediation class so Phase 9 can promote or demote
  # each on its own measured results. A class not listed here gets default_level (L0).
  llm-revert-change: L1
  llm-raise-memory-limit: L1
  llm-fix-config-value: L1
  llm-fix-env-var: L1
  llm-fix-probe: L1
  llm-fix-image-tag: L1
  llm-restore-dependency: L1

apps:                         # criticality raises the risk score; unknown apps count as 'normal'
  web-app: high
  backend-app: high
  oom-app: normal
  badconfig-app: normal
  crash-app: normal
  healthy-app: normal

risk:
  # Score = sum of the contributions below. Score >= l0_at downgrades L1 to L0 (a human is told, no PR is opened).
  l0_at: 60
  per_changed_line: 1.5
  touches_base: 15            # base/ is shared by every overlay; an overlay-only change is narrower
  high_criticality: 20
  memory_change_over_2x: 25
  deletes_a_file: 20

  l2_max_score: 30            # Phase 9: above this a promoted class still needs a human (L1); small, narrow changes only
  l3_max_score: 15

promotion:                    # Phase 9: policy/promotion.py. Evidence = live eval trials + human decisions, last window_days
  window_days: 30
  excluded:                   # never leave L1
    - llm-fix-image-tag       # signed-image verification is not built (docs/phase9.md), so an image change always needs a human
    - llm-restore-dependency  # touches how apps talk to each other; too broad to automate yet
  L2: {min_trials: 10, min_scenarios: 3, min_fix_rate: 0.9,  max_false_fixes: 0, min_approvals: 3}
  L3: {min_trials: 25, min_scenarios: 5, min_fix_rate: 0.95, max_false_fixes: 0, min_approvals: 10}

controls:                     # Phase 9: policy/controls.py. These stop automatic MERGING (the kill switch stops everything)
  soak_minutes: {L2: 30, L3: 2}   # a PR must be this old before the merger acts: time for a human to object
  require_verified_commits: true  # GitHub must report the PR's commits as signature-verified; fails closed when they are not
  allowed_path_prefixes: ["apps/"]
  max_changed_files: 3
  verify_after_minutes: 10        # an auto-merged fix whose incident is still open after this long counts against its class
  rate_limits:
    max_merges_per_hour: 2
    max_merges_per_day: 6
    max_merges_per_app_per_day: 2
  freeze_windows: []              # e.g. [{start: "2026-12-20T00:00:00Z", end: "2027-01-03T00:00:00Z", reason: "holiday freeze"}]
  weekly_freeze: []               # e.g. [{days: [fri, sat, sun], from: "00:00", to: "23:59", reason: "no weekend auto-merges"}]
