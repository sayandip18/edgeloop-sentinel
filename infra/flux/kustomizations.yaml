---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oom-app
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: edgeloop-sentinel
  path: ./apps/oom-app/overlays/healthy
  targetNamespace: apps
  serviceAccountName: deployer
