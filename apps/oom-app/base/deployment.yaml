apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-app
  labels:
    app: oom-app
    app.kubernetes.io/part-of: edgeloop-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-app
  template:
    metadata:
      labels:
        app: oom-app
    spec:
      containers:
        - name: oom-app
          image: edgeloop/oom-app:v1
          imagePullPolicy: Never
          env:
            - {name: ALLOC_MB, value: "32"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
