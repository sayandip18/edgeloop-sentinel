apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: oom-app}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 16Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 24Mi
