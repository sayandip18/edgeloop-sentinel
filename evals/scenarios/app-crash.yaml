id: app-crash
description: crash-app exits 1 after 5 seconds, repeatedly (CrashLoopBackOff).
inject: {app: crash-app, overlay: broken}
observe:
  app: crash-app
  symptom: {type: container_reason, reasons: [CrashLoopBackOff]}
recovery: {apps: [crash-app]}
expected:
  action: fix
  diagnosis:
    category: app_crash
    target_app: crash-app
    keywords: [CRASH_AFTER_SECONDS]
