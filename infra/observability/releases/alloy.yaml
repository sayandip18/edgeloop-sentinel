# Log collector. Tails pod logs in `apps` through the Kubernetes API (no hostPath mounts, which Docker Desktop
# makes awkward) and pushes them to Loki. Collects only the `apps` namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 10m
  releaseName: alloy
  targetNamespace: observability
  storageNamespace: observability
  serviceAccountName: obs-deployer
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: 1.15.0
      sourceRef: {kind: HelmRepository, name: grafana, namespace: flux-system}
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  values:
    controller: {type: deployment, replicas: 1}
    alloy:
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 192Mi}
      configMap:
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
            namespaces { names = ["apps"] }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.observability.svc:3100/loki/api/v1/push"
            }
          }
